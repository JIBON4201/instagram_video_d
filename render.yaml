services:
  - type: web
    name: reel-downloader
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: MAX_CONCURRENT
        value: 2
      - key: JOB_TTL_MIN
        value: 30
      - key: TRUST_PROXY
        value: 1
